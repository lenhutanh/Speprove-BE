# Analysis settings that are the same on every run.
# The organization and the project key are passed by the workflow from repository variables.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/scripts/**,src/types/**,**/*.d.ts
sonar.coverage.exclusions=src/scripts/**,src/types/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
# The quality gate only reports for now, so a red gate does not fail the build.
# Add sonar.qualitygate.wait=true once a first run is green.
