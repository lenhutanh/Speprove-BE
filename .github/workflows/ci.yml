name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the commit history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # mongodb-memory-server downloads a mongod binary on first use
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;const r=(n,k)=>'| '+n+' | '+t[k].pct+'% | '+t[k].covered+' / '+t[k].total+' |';console.log(['### Coverage','| Metric | Percent | Covered |','| :--- | :--- | :--- |',r('Lines','lines'),r('Statements','statements'),r('Branches','branches'),r('Functions','functions')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json

      # Fails on advisories rated high or critical; moderate ones are reported by Dependabot alerts
      - run: pnpm audit --audit-level=high

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Static analysis on SonarQube Cloud. It runs only when the SONAR_TOKEN secret exists, so a repository
      # or a pull request without the secret (a fork, Dependabot) skips it instead of failing.
      - id: sonar
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: SonarSource/sonarqube-scan-action@v8.5.1
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t speprove-be:${{ github.sha }} .
